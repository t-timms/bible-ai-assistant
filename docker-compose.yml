# Bible AI Assistant — Local development stack
#
# Prerequisites:
#   1. Ollama installed and running on the host: `ollama serve`
#   2. Model pulled:  `ollama run bible-assistant-orpo`
#   3. ChromaDB index built: `build-index`  (or: python rag/build_index.py)
#
# Usage:
#   docker compose up --build     # first run (builds images)
#   docker compose up             # subsequent runs
#   docker compose down           # stop and remove containers
#   docker compose logs -f        # stream logs
#
# Services:
#   rag-server  → http://localhost:8081  (RAG + FastAPI)
#   gradio-ui   → http://localhost:7860  (Gradio web interface)
#   tts         → http://localhost:8880  (Kokoro TTS, OpenAI-compatible)
#
# Security posture:
#   All published ports bind to 127.0.0.1 by default — nothing is reachable
#   from your LAN unless you deliberately change the binding (e.g. "8081:8081").
#   To require API keys on the RAG endpoints, export before `docker compose up`:
#     API_KEY=<secret>            # clients send: Authorization: Bearer <secret>
#     RAG_API_KEY=<same secret>   # lets the Gradio UI authenticate automatically
#
# Ollama runs on the host and is reached via host.docker.internal:11434.
# On Linux, add --add-host=host.docker.internal:host-gateway to the rag-server
# service if host.docker.internal is not automatically available.

services:
  rag-server:
    build:
      context: .
      dockerfile: deployment/pc/Dockerfile.rag
    image: bible-ai-rag:latest
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      OLLAMA_URL: "http://host.docker.internal:11434"
      RAG_HOST: "0.0.0.0"
      RAG_PORT: "8081"
      # Empty string = feature disabled (matches Settings defaults), so these
      # passthroughs are safe when the host variables are unset.
      API_KEY: "${API_KEY:-}"
      RATE_LIMIT: "${RATE_LIMIT:-60/minute}"
      LOG_JSON: "${LOG_JSON:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
    volumes:
      # Mount pre-built ChromaDB index read-only (build with: build-index)
      - ./rag/chroma_db:/app/rag/chroma_db:ro
    healthcheck:
      # python:slim ships no curl/wget — probe with the stdlib instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      # Cache downloaded models so they survive container restarts.
      - kokoro-models:/app/models
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:8880/v1/models > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  gradio-ui:
    build:
      context: .
      dockerfile: deployment/pc/Dockerfile.ui
    image: bible-ai-ui:latest
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      RAG_SERVER_URL: "http://rag-server:8081"
      TTS_URL: "http://tts:8880"
      GRADIO_HOST: "0.0.0.0"
      GRADIO_PORT: "7860"
      RAG_API_KEY: "${RAG_API_KEY:-${API_KEY:-}}"
    depends_on:
      rag-server:
        condition: service_healthy
      tts:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kokoro-models:
