version: 2
updates:
  # "uv" (not "pip") so Dependabot updates uv.lock together with pyproject.toml.
  # The pip ecosystem only edited pyproject.toml, so `uv lock --check` failed.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ml-deps:
        patterns: ["transformers", "trl", "peft", "unsloth*"]
      dev-deps:
        patterns: ["ruff", "pytest*", "pre-commit"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
