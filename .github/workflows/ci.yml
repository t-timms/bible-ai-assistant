name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify lockfile freshness
        # Fails when pyproject.toml bounds change without regenerating uv.lock
        # (this exact drift shipped vulnerable gradio 6.9.0 via `uv sync` once).
        run: |
          pip install uv
          uv lock --check

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-lint-

      - name: Install ruff
        run: pip install "ruff>=0.4.0,<1"

      - name: Check formatting
        run: ruff format --check training/ rag/ scripts/ ui/ voice/ tests/ deployment/ --exclude chroma_db,checkpoints,checkpoints-orpo,wandb,unsloth_compiled_cache

      - name: Run linter
        run: ruff check training/ rag/ scripts/ ui/ voice/ tests/ deployment/ --exclude chroma_db,checkpoints,checkpoints-orpo,wandb,unsloth_compiled_cache

  type-check:
    name: Type Check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-typecheck-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-typecheck-

      - run: |
          pip install -e ".[rag,dev]"
          pip install mypy

      - run: mypy --ignore-missing-imports rag/ training/
        # scripts/ excluded: standalone CLI tools without __init__.py cause
        # mypy's module-path ambiguity error ("Source file found twice").

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-security-

      - name: Install project and security tools
        run: |
          python -m pip install --upgrade pip
          # [build-system] requires in pyproject.toml only governs the isolated
          # build env for this package's own wheel -- it doesn't upgrade the
          # ambient/active environment pip-audit scans below, which is why this
          # explicit upgrade is also needed (PYSEC-2026-3447).
          pip install --upgrade "setuptools>=83.0.0"
          pip install -e ".[rag,ui]"
          pip install "pip-audit>=2.7.0" "bandit[toml]>=1.7.9"

      - name: Audit dependencies for CVEs
        # pip-audit scans the active environment — no requirement file needed
        # CVE-2026-4539 (pygments 2.19.2): no upstream fix available yet.
        # Revisit when pygments ships a patched release.
        #
        # CVE-2026-1839 (transformers Trainer._load_rng_state unsafe torch.load):
        # fixed upstream in v5.0.0rc3; this repo locks transformers >= 5.3 with
        # torch >= 2.6 (uv.lock: 5.3.0 / 2.11.0), so no installed version falls
        # inside the affected range. The ignore exists only because pip-audit's
        # OSV ranges can over-match pre-fix version floors; drop it if the
        # advisory ever flags a genuinely affected installed version.
        #
        # PYSEC-2026-311, CVE-2026-45830, CVE-2026-45831, CVE-2026-45833 (chromadb):
        # all in chromadb's own multi-tenant server layer -- authenticated-user
        # privilege escalation via update_collection's trust_remote_code model
        # loading (45833), V1 endpoint tenant/database scoping bypass (45830),
        # cross-tenant authorization gaps (45831). This project only uses
        # chromadb.PersistentClient (rag/retrieval.py, rag/build_index.py) --
        # embedded, in-process, no chromadb server/API ever exposed on a
        # network port, no chromadb-level authentication/authorization
        # configured or reachable. The vulnerable code paths (V1/V2 HTTP
        # endpoints, authenticated-user RBAC) are not present in this
        # deployment. No fixed chromadb release exists yet (latest on PyPI is
        # still 1.5.9, the version already in use) -- revisit when one ships,
        # and re-check applicability if chromadb's own server component is
        # ever run standalone instead of embedded.
        run: >
          pip-audit
          --ignore-vuln CVE-2026-4539
          --ignore-vuln CVE-2026-1839
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln CVE-2026-45830
          --ignore-vuln CVE-2026-45831
          --ignore-vuln CVE-2026-45833

      - name: Run bandit static analysis
        run: bandit -c pyproject.toml -r rag/ training/ scripts/ ui/ voice/ -ll --quiet

  test:
    name: Test
    needs: [type-check, security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-

      - name: Install dependencies
        # Install only what the tests need — avoids pulling the full ML training stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rag,dev]"

      - name: Run unit tests with coverage
        # No --cov-fail-under here on purpose: pyproject [tool.coverage.report]
        # fail_under = 60 is the single source of truth for the gate.
        run: python -m pytest tests/ -v --tb=short -x --cov=rag --cov=training --cov-report=term-missing --junitxml=test-results.xml
        env:
          PYTHONPATH: .

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  docker:
    name: Docker Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build RAG server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/pc/Dockerfile.rag
          push: false
          tags: bible-ai-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Gradio UI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/pc/Dockerfile.ui
          push: false
          tags: bible-ai-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
