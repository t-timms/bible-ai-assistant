# Bible Assistant — versioned evaluation protocol (v4)
# Bump protocol_id / version when you change the question suite, judge rubric, or metric definitions.
# v3 -> v4 changes (2026-09-02): the single verse_lookup category is split into
# verse_quote (verbatim-recall, exact-match valid) and verse_exposition
# (explanation expected, exact-match invalid). This is a re-bucketing of the
# SAME 282 questions and the SAME per-item responses — no model was re-run to
# produce v4. verse_lookup numbers from v1/v2/v3 are NOT directly comparable to
# v4's verse_quote / verse_exposition; every other category is unchanged and
# stays comparable to v3.

protocol_id: bible_assistant_baseline_v4
protocol_version: 4

# Frozen snapshots — hash-pinned. The v3 snapshot below is the v2 snapshot with
# the verse_lookup category split (see changes_from_v3); questions/answers are
# byte-identical, only the `category` field changes on 102 items.
suite_path: benchmarks/suites/evaluation_questions.v3.json
suite_sha256: f6640605c7d214e8359adc16543bf0b26280a309dabe8cdf98d0a1dbe7f0b770
suite_v2_snapshot: benchmarks/suites/evaluation_questions.v2.json
suite_v2_sha256: 1ef4df4f7b9bf9eaf0ff14e720bf33d048f23440ed1d1b624497f7ab84b0d279
suite_v1_snapshot: benchmarks/suites/evaluation_questions.v1.json
suite_v1_sha256: b4db19e1f09b547eca6bebca9e123814e5f67dd7ebf31eee39b199f3d463b9f4

description: >
  Same harness and metric semantics as v3, with one structural change: the
  verse_lookup category (102 Qs) is split by question phrasing into verse_quote
  (66 Qs — "What does X say?", "Can you tell me what X says?", "Quote X for me.")
  and verse_exposition (36 Qs — "What does X teach?", "What is X about?"). The
  split is deterministic: a question is verse_exposition iff its text ends with
  "teach?" or "about?" (case-insensitive), else verse_quote. Rationale:
  exposition-phrased questions ask the model to explain a verse, so exact
  verbatim-substring match scores a correct explanation as a failure — the same
  reason protocol v3 stopped applying quote metrics to the refusal category.
  verse_quote keeps exact-match as its headline metric; verse_exposition is
  scored by fuzzy pass-rate (+ optional judge, + manual read) and its
  exact-match number is reported but is NOT an accuracy.

changes_from_v3:
  - "verse_lookup -> {verse_quote (66), verse_exposition (36)}. Deterministic
     rule: verse_exposition iff question.strip() matches /(teach|about)\\?$/i.
     Produced by scripts/make_v4_suite.py from the v2 snapshot; no question,
     answer, or other category altered."
  - "verse_exposition headline metric is verse_accuracy_fuzzy pass-rate @0.85,
     not exact substring. avg_verse_accuracy (exact) is still recorded for the
     category but flagged non-primary — a prose explanation of a verse is a
     pass even at exact-match 0."
  - "Overall aggregates are reported two ways for v4: (a) all-in (every scored
     category, directly continues the v3 'overall fuzzy mean' definition) and
     (b) exposition-excluded (verse_exposition dropped from the overall
     denominator, the way refusal already is), because averaging a
     known-wrong metric into the headline understates a model that explains
     instead of quote-dumping. Report both; do not silently pick one."
  - "LLM-judge on this hardware: the v3 default judge qwen3.5:27b (Q4_K_M, ~17 GB)
     does NOT fit the 16 GB VRAM budget — it CPU-offloads and a single rubric
     call measured 333.7 s on 2026-09-02 (idle GPU), which exceeds evaluate.py's
     180 s judge timeout and is why the 2026-09-01 and 2026-09-02 judge runs
     both died on question 1. Protocol-v4 judge runs, when done at all, use
     judge_model qwen3:8b (fits VRAM, runs on-GPU). Judge output is
     calibration-only for v4 (same status as FMG-Bench) — NOT an acceptance
     gate — and v3<->v4 judge scores are not comparable (different judge model)."
  - "No change to: suite question text/answers, decoding params, hallucination
     verification modes, citation regex + rag/verification.py, Wilson CI /
     McNemar / bootstrap stats, or the metric_constants below."

metrics:
  keyword:
    summary: >
      Exact-substring overlap (verse_accuracy) + fuzzy overlap at threshold 0.85
      (verse_accuracy_fuzzy pass-rate + mean similarity) + citation regex +
      real per-verse citation verification (rag/verification.py).
      Rates carry Wilson 95% CIs; paired A/B deltas use McNemar + bootstrap.
      verse_quote: headline = exact-match. verse_exposition: headline = fuzzy
      pass-rate @0.85; exact-match reported but non-primary.
    cli: python training/evaluate.py --protocol-id bible_assistant_baseline_v4 --ollama-model <name>
    rescore_from_v3_runs: >
      No re-generation needed to move an existing protocol-v3 keyword run to v4 —
      the per-item responses and scores are unchanged. scripts/rescore_v4.py
      re-buckets an existing 20260901_*_keyword.json and re-aggregates under the
      v4 categories.
  judge:
    summary: Five 1-5 rubric dimensions. v4 judge_model = qwen3:8b (VRAM-fit);
      calibration only, not a gate; parse failures excluded from means and
      reported separately.
    cli: python training/evaluate.py --judge --judge-model qwen3:8b --protocol-id bible_assistant_baseline_v4 --ollama-model <name>

metric_constants:
  fuzzy_pass_threshold: 0.85
  min_category_n_for_percentage: 30

decoding:
  temperature: 0.0
  seed_required: true

judge:
  # 27B does not fit 16 GB here (see changes_from_v3). v4 uses an 8B judge.
  default_model: qwen3:8b
  superseded_default: qwen3.5:27b   # v3 default; infeasible on this box
  default_url_env: OLLAMA_URL
  role: calibration_only            # NOT an acceptance gate in v4
  dimensions:
    - faithfulness
    - citation
    - hallucination
    - helpfulness
    - conciseness

reproducibility_checklist:
  - RAG server and Chroma index unchanged (or document commit + index build)
  - Same Ollama model tag (e.g. bible-assistant-orpo vs bible-assistant-orpo-f16)
  - Same judge model weights for --judge runs (v4 = qwen3:8b, NOT the v3 27B)
  - Record GPU/driver and llama.cpp / Ollama versions in run notes when comparing quantizations
  - Report which protocol_id (v1/v2/v3/v4) a given result used — scores across protocols are not comparable
  - verse_lookup (v1-v3) vs verse_quote/verse_exposition (v4) are NOT comparable; other categories are
  - Verify suite sha256 before trusting any comparison (run_benchmark.py fails fast on mismatch)
