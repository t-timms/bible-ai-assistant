# Bible Assistant — versioned evaluation protocol (v3)
# Bump protocol_id / version when you change the question suite, judge rubric, or metric definitions.
# v2 -> v3 changes (2026-08-25): scores from v2/v3 are NOT directly comparable for topical,
# character, cross_reference, and verse_lookup categories until models are retrained on
# decontaminated data (see changes_from_v2 below).

protocol_id: bible_assistant_baseline_v3
protocol_version: 3

# Frozen snapshots — the mutable prompts/evaluation_questions.json is NO LONGER referenced.
# Historical results produced against the mutable file cannot be reproduced; these copies can.
suite_path: benchmarks/suites/evaluation_questions.v2.json
suite_sha256: 1ef4df4f7b9bf9eaf0ff14e720bf33d048f23440ed1d1b624497f7ab84b0d279
suite_v1_snapshot: benchmarks/suites/evaluation_questions.v1.json
suite_v1_sha256: b4db19e1f09b547eca6bebca9e123814e5f67dd7ebf31eee39b199f3d463b9f4

description: >
  Same harness as v2 with three integrity upgrades: (1) the question suite is a hash-pinned
  frozen snapshot instead of a live file shared by both manifest versions; (2) metric semantics
  are pinned by named constants and canned-response regression tests so scoring code cannot
  silently drift between protocols; (3) every run records its decoding parameters and its
  hallucination-check mode, because a corpus-fallback run is not comparable to a verified run.

changes_from_v2:
  - "Suite frozen: benchmarks/suites/*.json snapshots with sha256 pins replace the mutable
     prompts/evaluation_questions.json reference (both prior manifests pointed at the same
     mutable file, so no historical run was byte-reproducible)."
  - "Known contamination disclosure: ~100 of v2's 282 questions were duplicated verbatim
     (question AND expected answer) in the expanded SFT/ORPO training data generated in the
     same release. Topical/character/cross_reference numbers from models trained on that data
     measure memorization. Training builders now exclude all snapshot questions; re-baseline
     after retraining."
  - "verse_accuracy_fuzzy gains a decision threshold: FUZZY_PASS_THRESHOLD = 0.85. Runs report
     mean similarity AND pass-rate at threshold; the bare mean is not an accuracy."
  - "Refusal-category questions are counted only (no verse-accuracy/citation percentages) —
     scoring behavioral instructions with quote metrics produced structural zeros."
  - "Judge parse failures are excluded from category means and reported as parse_failure_rate;
     previously they entered means as zeros."
  - "Decoding params (temperature=0, seed) recorded per run; hallucination verification_mode
     ('corpus' | 'book_name_fallback') recorded per run."

metrics:
  keyword:
    summary: >
      Exact-substring overlap (verse_accuracy) + fuzzy overlap at threshold 0.85
      (verse_accuracy_fuzzy pass-rate + mean similarity) + citation regex +
      real per-verse citation verification (rag/verification.py).
      Rates carry Wilson 95% CIs; paired A/B deltas use McNemar + bootstrap.
    cli: python training/evaluate.py --protocol-id bible_assistant_baseline_v3 --ollama-model <name>
  judge:
    summary: Five 1–5 rubric dimensions (same judge model required for comparability);
      parse failures excluded from means and reported separately
    cli: python training/evaluate.py --judge --protocol-id bible_assistant_baseline_v3 --ollama-model <name>

metric_constants:
  fuzzy_pass_threshold: 0.85
  min_category_n_for_percentage: 30

decoding:
  temperature: 0.0
  seed_required: true

judge:
  # Default judge in evaluate.py; override with --judge-model. Example alternates: qwen3:32b, qwen3-coder:30b
  default_model: qwen3.5:27b
  default_url_env: OLLAMA_URL
  dimensions:
    - faithfulness
    - citation
    - hallucination
    - helpfulness
    - conciseness

reproducibility_checklist:
  - RAG server and Chroma index unchanged (or document commit + index build)
  - Same Ollama model tag (e.g. bible-assistant-orpo vs bible-assistant-orpo-f16)
  - Same judge model weights for --judge runs
  - Record GPU/driver and llama.cpp / Ollama versions in run notes when comparing quantizations
  - Report which protocol_id (v1/v2/v3) a given result used — scores across protocols are not comparable
  - Verify suite sha256 before trusting any comparison (run_benchmark.py fails fast on mismatch)
