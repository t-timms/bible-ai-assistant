# Bible AI Assistant - Training Config
# Qwen3.5-4B: use bf16 LoRA (load_in_4bit: false). Unsloth does NOT recommend 4-bit for Qwen3.5.

model:
  name: "Qwen/Qwen3.5-4B"
  load_in_4bit: false
  max_seq_length: 2048  # 4096 OOMs on 16GB with bf16 LoRA; 2048 fits

lora:
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"

training:
  output_dir: "checkpoints"
  eval_split: 0.1  # Fraction of data held out for evaluation during training
  num_train_epochs: 3
  per_device_train_batch_size: 2   # 4 OOMs with 2048 seq; use grad_accum 8 for effective 16
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  # Schedule coherence (audit T5): cosine decay + ratio-based warmup instead of the
  # old linear schedule with absolute warmup_steps=100 (drifted off-peak on short runs).
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  # eval/save cadence is DERIVED at startup: total_steps = ceil(n*epochs/effective_batch),
  # eval every min(max_eval_steps, total_steps // 6) so load_best_model_at_end actually fires.
  max_eval_steps: 50
  logging_steps: 50
  bf16: true   # REQUIRED for Blackwell (RTX 5070 Ti). Do not use fp16.
  report_to: "wandb"
  random_state: 3407  # Seed for train/eval split and LoRA init

orpo:
  # Must match lora.dropout above so ORPO continues SFT with identical regularization.
  lora_dropout: 0.1
  # Per-category preference pair budget (audit T4b; total ~2080).
  pair_counts:
    hard_negative: 600
    instruction_leak: 380
    verbose: 320
    repetition: 240
    answer_prefix: 220
    think_tag_leak: 150
    hallucination_fake_book: 80
    bible_for_everything: 90

data:
  train_file: "data/processed/train.json"
  eval_file: null  # optional
