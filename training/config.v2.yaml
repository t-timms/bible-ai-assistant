# Bible AI Assistant - V2 Training Config (STRETCH — 27B)
# Full-canon rebuild at the top of the Qwen3.5 dense line (0.8/2/4/9/27B — there
# is no 8B or 14B). Run training/config.v2-9b.yaml FIRST; only attempt 27B if 9B
# clears the v1 baseline convincingly. 27B QLoRA on 16 GB is very tight: 4-bit is
# mandatory, and even then expect to shorten seq length and/or offload.

model:
  name: "Qwen/Qwen3.5-27B"
  load_in_4bit: true           # 27B has no bf16-LoRA path on 16 GB
  max_seq_length: 2048
  # 27B @ 4-bit + 2048 seq is on the edge — drop to 1536/1024 if it OOMs

lora:
  r: 32                        # doubled vs v1: more capacity for canon-scale memorization
  alpha: 64                    # keep alpha = 2*r
  dropout: 0.05                # less regularization: 50k+ examples dilute overfit risk
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"

training:
  output_dir: "checkpoints_v2"
  eval_split: 0.05             # eval data now drawn from frozen suite snapshots instead
  num_train_epochs: 2          # large corpus -> fewer epochs to avoid overfitting
  per_device_train_batch_size: 1   # 27B needs the tighter footprint
  gradient_accumulation_steps: 16  # effective batch 16 preserved
  learning_rate: 1.0e-4        # lower for larger base
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_eval_steps: 50
  logging_steps: 25
  bf16: true                   # REQUIRED on Blackwell
  report_to: "wandb"
  random_state: 20260827

grpo:
  # Stage-3 scaffold. Reward is fully programmatic (no LLM judge):
  #   R = w1*citation_exists_in_index + w2*quoted_text_matches_named_translation
  #     + w3*format_compliance (prompt_format contract)
  reward_weights:
    citation_exists: 0.5
    text_match_exact: 0.35      # normalized comparison; near_match partial credit optional
    format_compliance: 0.15
  num_generations: 8            # group size for relative advantage
  beta_kl: 0.02                 # light KL anchor to SFT policy
  max_completion_length: 512

data:
  train_file: "data/processed/train_v2.json"
  manifest_file: "data/processed/train_v2.manifest.json"
